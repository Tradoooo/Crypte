name: CI Rust

# CI Rust + frontend (branche Tauri) : formatage, lints, build, tests.
# Cinq jobs indépendants (parallélisme maximal sur les runners
# horror_cli-worker du r630), chacun borné à 5 min (règle user 2026-10-24).
# `--locked` partout côté Rust : le build CI utilise exactement Cargo.lock.
# Noms des 4 checks Rust inchangés (exigés par la file Mergify).

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Toolchain Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatage
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Toolchain Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache APT (paquets pré-téléchargés)
        uses: actions/cache@v4
        with:
          # Le téléchargement (`/var/cache/apt/archives`) est root-only :
          # on le copie dans un dossier lisible après l'installation, puis
          # on le restaure avant (cache hit = zéro téléchargement réseau).
          path: .apt-cache
          key: apt-tauri-syslibs-v2
      - name: Syslibs Tauri (webkit)
        run: |
          debs="$GITHUB_WORKSPACE/.apt-cache/debs"
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 librsvg-2.0; then
            echo "Syslibs Tauri déjà présentes sur le runner."
            exit 0
          fi
          if [ -d "$debs" ] && [ -n "$(ls -A "$debs" 2>/dev/null)" ]; then
            # Debs déjà téléchargés au run précédent : apt les réutilise
            # tels quels (hash identique), zéro réseau lent. Si une version
            # a changé, on retombe sur le téléchargement réseau normal.
            sudo -n cp "$debs"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            sudo -n apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev && exit 0
          fi
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          mkdir -p "$debs"
          sudo -n cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null || true
      - name: Lints (zéro warning)
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Toolchain Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache APT (paquets pré-téléchargés)
        uses: actions/cache@v4
        with:
          # Le téléchargement (`/var/cache/apt/archives`) est root-only :
          # on le copie dans un dossier lisible après l'installation, puis
          # on le restaure avant (cache hit = zéro téléchargement réseau).
          path: .apt-cache
          key: apt-tauri-syslibs-v2
      - name: Syslibs Tauri (webkit)
        run: |
          debs="$GITHUB_WORKSPACE/.apt-cache/debs"
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 librsvg-2.0; then
            echo "Syslibs Tauri déjà présentes sur le runner."
            exit 0
          fi
          if [ -d "$debs" ] && [ -n "$(ls -A "$debs" 2>/dev/null)" ]; then
            # Debs déjà téléchargés au run précédent : apt les réutilise
            # tels quels (hash identique), zéro réseau lent. Si une version
            # a changé, on retombe sur le téléchargement réseau normal.
            sudo -n cp "$debs"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            sudo -n apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev && exit 0
          fi
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          mkdir -p "$debs"
          sudo -n cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null || true
      - name: Compilation
        run: cargo build --locked

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Toolchain Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache APT (paquets pré-téléchargés)
        uses: actions/cache@v4
        with:
          # Le téléchargement (`/var/cache/apt/archives`) est root-only :
          # on le copie dans un dossier lisible après l'installation, puis
          # on le restaure avant (cache hit = zéro téléchargement réseau).
          path: .apt-cache
          key: apt-tauri-syslibs-v2
      - name: Syslibs Tauri (webkit)
        run: |
          debs="$GITHUB_WORKSPACE/.apt-cache/debs"
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 librsvg-2.0; then
            echo "Syslibs Tauri déjà présentes sur le runner."
            exit 0
          fi
          if [ -d "$debs" ] && [ -n "$(ls -A "$debs" 2>/dev/null)" ]; then
            # Debs déjà téléchargés au run précédent : apt les réutilise
            # tels quels (hash identique), zéro réseau lent. Si une version
            # a changé, on retombe sur le téléchargement réseau normal.
            sudo -n cp "$debs"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            sudo -n apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev && exit 0
          fi
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          mkdir -p "$debs"
          sudo -n cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null || true
      - name: Tests
        # Une relance unique : flake runner observé (mbox::vague::tests::run_mini_et_usages).
        run: cargo test --locked || cargo test --locked

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Node (LTS + cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances (verrouillées)
        run: npm ci
      - name: Types (svelte-check)
        run: npm run check
      - name: Tests (vitest)
        run: npm test
      - name: Build (vite)
        run: npm run build
